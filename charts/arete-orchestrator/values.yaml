---
orchestrator:
  name: orchestrator
  serviceAccountName: orchestrator
  imageRepository: us-central1-docker.pkg.dev/padi-staging/cnscp/cns-orchestrator
  imageTag: latest
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - artifact-registry-secret
  credentialsSecretRef: arete-etcd-user-credentials
  replicas: 1
  config:
    - name: CNS_HOST
      value: "http://arete-etcd"
    - name: CNS_PORT
      value: 2379
    - name: CNS_PROFILES
      value: "https://cp.padi.io/profiles"

  # Additional Environment variables can go here
  #
  # env:
  #   - name: 
  #     value: 

  # If rollPods is set to True, it will create a randAlphaNum annotation
  # which is used to roll the pods on each deploy
  #
  # rollPods: false
