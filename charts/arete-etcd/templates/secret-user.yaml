{{- $secretName := printf "%s-user-credentials" .Values.etcd.name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $username := .Values.etcd.username }}
{{- $password := .Values.etcd.userPassword }}
{{- if and (not $username) $existing.data }}
{{- $username = index $existing.data "CNS_USERNAME" | b64dec }}
{{- end }}
{{- if and (not $password) $existing.data }}
{{- $password = index $existing.data "CNS_PASSWORD" | b64dec }}
{{- end }}
{{- if not $username }}
{{- $username = randAlphaNum 9 }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  CNS_USERNAME: {{ $username | b64enc }}
  CNS_PASSWORD: {{ $password | b64enc }}
