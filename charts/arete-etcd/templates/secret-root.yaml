{{- $secretName := printf "%s-root-credentials" .Values.etcd.name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.etcd.rootPassword }}
{{- if and (not $password) $existing.data }}
{{- $password = index $existing.data "ETCD_ROOT_PASSWORD" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
data:
  ETCD_ROOT_USERNAME: cm9vdA==
  ETCD_ROOT_PASSWORD: {{ $password | b64enc }}
